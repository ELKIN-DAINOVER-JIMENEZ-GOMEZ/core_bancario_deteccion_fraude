# Configuración de Alembic para el fraud-engine.
#
# La URL de la base de datos NO se define aquí: alembic/env.py la lee de la
# variable de entorno DATABASE_URL (postgresql+asyncpg://usuario:clave@host:5432/db).
#
# Comandos habituales (desde la raíz del proyecto):
#   alembic upgrade head                                   # aplicar migraciones
#   alembic downgrade -1                                   # revertir la última
#   alembic current                                        # versión aplicada
#   alembic revision --autogenerate -m "descripcion"       # nueva migración desde los modelos
#   alembic check                                          # falla si los modelos y las migraciones difieren

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# Nombre de los archivos: 20261011_0001_create_fraud_tables.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Longitud máxima del texto "slug" en el nombre del archivo
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S